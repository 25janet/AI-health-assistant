# This is a basic workflow to help you get started with Actions

name: CI pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master", "feature-memory-check"]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  bash-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Check bash version
        run: bash --version
      
      - name: Check script syntax
        run:  bash -n monitoring/health_check.sh

      - name: run health check
        run: bash monitoring/health_check.sh
      
      - name: Upload Health log
        uses: actions/upload-artifact@v4
        with: 
            name: health-log
            path: data/raw/health.log
  python-check:
    runs-on: ubuntu-latest
    needs: bash-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check python version
        run: python3 --version

      - name: Download Health log
        uses: actions/upload-artifact@v4
        with: 
            name: health-log
            path: data/raw/health.log

      - name: Run python parser
        run: python3  monitoring/health_parser.py
      
      - name: Validate Generated Json file
        run: python3 -m json.tool data/processed/health_report.json
  docker-build:
    runs-on: ubuntu-latest
    needs: python-check

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker compose build
      
      - name: Run health check container
        run: docker compose run --rm health-check