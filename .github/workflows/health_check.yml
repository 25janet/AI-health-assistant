# This is a basic workflow to help you get started with Actions

name: CI pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master", "feature-memory-check"]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command to confirm bash is pre-installed
      - name: Check bash version
        run: bash --version

      # Runs a single command to check if the script has syntax errors
      - name: Check the script syntax
        run: bash -n health_check.sh
        
        # Runs a command to run the script
      - name: Run the health_check script
        run: bash ./health_check.sh
        
      - name: CI Completed
        run: echo "Health check completed successfully"
